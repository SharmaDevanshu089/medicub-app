services:
  medicub:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - MEDICUB_STATIC_DIR=/app/v2/dist
      - WISPR_FLOW_API_KEY=${WISPR_FLOW_API_KEY:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_ENDPOINT=${AI_ENDPOINT:-}
      - AI_MODEL=${AI_MODEL:-}
      - MEDICUB_ADMIN_KEY=${MEDICUB_ADMIN_KEY:-medicub-v2-admin}
    volumes:
      - medicub_data:/app/v2/server/data
    restart: unless-stopped

volumes:
  medicub_data:

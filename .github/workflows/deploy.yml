# Every push to main: typecheck → test → build → deploy to production (https://medicub.vercel.app).
# Pull requests get the same checks plus a preview deployment. Needs repo secret VERCEL_TOKEN.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true # a newer push replaces an older, still-running deploy, so production is always the latest commit

env:
  VERCEL_ORG_ID: team_0UMSeerTDLmGAoIcQbyBDBL5
  VERCEL_PROJECT_ID: prj_G5wbVKq7jvhcjwpsS1z5jFQIpD7R

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Tests
        run: npx vitest run
      - name: Check deploy token
        id: token
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "::warning::VERCEL_TOKEN secret is not set, so this run only checked the code. Add it under Settings → Secrets → Actions."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Pull Vercel settings
        if: steps.token.outputs.ok == 'true'
        run: npx vercel@latest pull --yes --environment=${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }} --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build
        if: steps.token.outputs.ok == 'true'
        run: npx vercel@latest build ${{ github.ref == 'refs/heads/main' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy
        if: steps.token.outputs.ok == 'true'
        run: |
          url=$(npx vercel@latest deploy --prebuilt ${{ github.ref == 'refs/heads/main' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }} --meta gitCommitSha=${{ github.sha }})
          echo "Deployed ${{ github.sha }} to $url" >> "$GITHUB_STEP_SUMMARY"

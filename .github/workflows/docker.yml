name: Container Build

on:
  push:
    branches: [ main, v2-scribe ]
    paths:
      - 'Dockerfile'
      - 'server/**'
      - 'v2/server/**'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

jobs:
  build-container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log into GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push Server Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/medicub-server:latest
            ghcr.io/${{ github.repository_owner }}/medicub-server:${{ github.sha }}

name: Build & Publish v2 Container

on:
  push:
    branches: [ main, v2-scribe ]
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'v2/**'
      - 'scripts/docker-smoke-test.mjs'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test Container via Docker Compose Before Push
        run: |
          docker compose up -d --build
          node scripts/docker-smoke-test.mjs
          docker compose down -v

      - name: Normalize lowercase registry owner
        id: meta
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log into GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push v2 Server Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/medicub-v2:latest
            ghcr.io/${{ steps.meta.outputs.owner }}/medicub-v2:${{ github.sha }}
            ghcr.io/${{ steps.meta.outputs.owner }}/medicub-server:latest

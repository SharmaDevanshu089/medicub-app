name: Build v2 Windows Package

on:
  push:
    branches:
      - main
      - v2-scribe
    paths:
      - 'v2/**'
      - 'scripts/package-windows.mjs'
      - '.github/workflows/build-windows.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:
  release:
    types: [ created, published ]

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Package Medicub v2 Windows Desktop Bundle
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: v2/package-lock.json

      - name: Install v2 dependencies
        shell: pwsh
        run: |
          cd v2
          npm ci

      - name: Compile Medicub v2 Production Build
        shell: pwsh
        run: |
          cd v2
          npm run build

      - name: Package Medicub v2 Windows Distribution
        shell: pwsh
        run: |
          node scripts/package-windows.mjs

      - name: Upload Windows Distribution Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: medicub-v2-windows-x64
          path: dist-windows/medicub-v2-windows-x64.zip
          retention-days: 30

      - name: Attach Windows Zip to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist-windows/medicub-v2-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

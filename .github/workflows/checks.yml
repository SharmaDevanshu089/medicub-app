# Every push and pull request: install, typecheck, build, run all tests (v1 & v2).
name: Checks

on:
  push:
  pull_request:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install v2 dependencies
        run: cd v2 && npm ci

      - name: Typecheck v1 and v2
        run: |
          npx tsc --noEmit
          cd v2 && npx tsc --noEmit

      - name: Build Web Production Bundles
        run: |
          npm run build
          npm run v2:build

      - name: Run Test Suites (v1 and v2 - 82 tests)
        run: |
          npx vitest run
          npm run v2:test
